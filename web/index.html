<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Forestia: Η Μεγάλη Περιπέτεια (1998) - Web Edition</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at center, #1a2a18 0%, #080f08 100%);
      color: #e0eed0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      padding: 16px;
    }
    header {
      margin-bottom: 12px;
      text-align: center;
    }
    h1 {
      font-size: 1.6rem;
      letter-spacing: 0.05em;
      color: #c9e69c;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
      margin-bottom: 4px;
    }
    .subtitle {
      font-size: 0.85rem;
      color: #8fa880;
    }
    #game-container {
      position: relative;
      width: min(94vw, calc(74vh * 4 / 3));
      aspect-ratio: 4 / 3;
      background: #000;
      box-shadow: 0 12px 50px rgba(0,0,0,0.85), 0 0 0 2px #3d5530;
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas#canvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    #overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(16, 28, 14, 0.75) 0%, rgba(6, 12, 6, 0.95) 100%), url('splash.png') center/cover no-repeat;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 10;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }
    #overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .splash-card {
      background: rgba(14, 26, 12, 0.88);
      border: 2px solid #5a7d3c;
      border-radius: 16px;
      padding: 20px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      box-shadow: 0 15px 45px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.15);
      backdrop-filter: blur(6px);
      max-width: 440px;
      width: 90%;
      text-align: center;
    }
    .splash-img {
      width: 100%;
      max-width: 320px;
      height: auto;
      border-radius: 8px;
      border: 2px solid #3d5530;
      box-shadow: 0 4px 18px rgba(0,0,0,0.6);
      image-rendering: pixelated;
    }
    .splash-title {
      font-size: 1.25rem;
      font-weight: bold;
      color: #daf0b2;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }
    .splash-edition {
      font-size: 0.8rem;
      color: #9ecc75;
      margin-top: -8px;
    }
    .btn-play {
      background: linear-gradient(180deg, #5da832 0%, #356e18 100%);
      color: #fff;
      border: 1px solid #8be046;
      padding: 13px 36px;
      font-size: 1.15rem;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.4);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .btn-play:hover {
      transform: scale(1.04);
      background: linear-gradient(180deg, #6cbf3a 0%, #3f831d 100%);
      box-shadow: 0 6px 22px rgba(80, 160, 40, 0.4);
    }
    .btn-play:active {
      transform: scale(0.98);
    }
    #status-box {
      font-size: 0.85rem;
      color: #b5d59f;
      text-align: center;
    }
    #progress-bar {
      width: 260px;
      height: 8px;
      background: #152412;
      border-radius: 4px;
      overflow: hidden;
      display: none;
      border: 1px solid #3d5530;
    }
    #progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #62b336, #9ef060);
      transition: width 0.2s ease;
    }
    footer {
      margin-top: 14px;
      display: flex;
      gap: 18px;
      font-size: 0.8rem;
      color: #6d8860;
    }
    footer a {
      color: #9ecc75;
      text-decoration: none;
    }
    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header>
    <h1>Forestia: Η Μεγάλη Περιπέτεια</h1>
    <div class="subtitle">Digital Preservation &bull; Ελληνική Έκδοση 1998 &bull; Powered by ScummVM WebAssembly</div>
  </header>

  <div id="game-container">
    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>

    <div id="overlay">
      <div class="splash-card">
        <img class="splash-img" src="splash.png" alt="Forestia - Cover Artwork">
        <div class="splash-title">Forestia: Η Μεγάλη Περιπέτεια</div>
        <div class="splash-edition">Εκδοτικός Οργανισμός Λιβάνη / Kaiphea (1998)</div>

        <button id="start-btn" class="btn-play">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          Έναρξη Παιχνιδιού (Play)
        </button>

        <div id="progress-bar"><div id="progress-fill"></div></div>
        <div id="status-box">Κάντε κλικ για άμεση εκκίνηση &amp; αναπαραγωγή ήχου</div>
      </div>
    </div>
  </div>

  <footer>
    <a href="https://github.com/panlybero/forestia-greek-adventure" target="_blank" rel="noopener">GitHub Project</a>
    &bull;
    <a href="https://github.com/panlybero/forestia-greek-adventure/releases" target="_blank" rel="noopener">Desktop Versions</a>
    &bull;
    <a href="#" id="fullscreen-btn">Πλήρης Οθόνη</a>
    &bull;
    <span style="opacity:.6">build 20261013b</span>
  </footer>

  <script>
    const BUILD = '20261013b'; // bump to bust browser caches of the engine/config
    window.resolveScummUrl = function(url) {
      var clean = url.startsWith('/') ? url.substring(1) : url;
      var base = window.location.href;
      if (!base.endsWith('/')) {
        if (base.endsWith('.html') || base.endsWith('.htm')) {
          base = base.substring(0, base.lastIndexOf('/') + 1);
        } else {
          base = base + '/';
        }
      }
      var out = new URL(clean, base);
      if (clean === 'scummvm.ini') out.searchParams.set('v', BUILD);
      return out.href;
    };

    const overlay = document.getElementById('overlay');
    const startBtn = document.getElementById('start-btn');
    const statusBox = document.getElementById('status-box');
    const progressBar = document.getElementById('progress-bar');
    const progressFill = document.getElementById('progress-fill');
    const canvas = document.getElementById('canvas');
    const fullscreenBtn = document.getElementById('fullscreen-btn');

    fullscreenBtn.addEventListener('click', (e) => {
      e.preventDefault();
      const container = document.getElementById('game-container');
      if (!document.fullscreenElement) {
        container.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    });

    var Module = {
      arguments: ['forestia-win-el'],
      locateFile: function(path) {
        return path + '?v=' + BUILD;
      },
      preRun: [],
      postRun: [],
      print: function(text) {
        console.log('[ScummVM]', text);
      },
      printErr: function(text) {
        console.error('[ScummVM]', text);
      },
      canvas: (function() {
        canvas.addEventListener("webglcontextlost", function(e) {
          alert("WebGL context lost. Please reload the page.");
          e.preventDefault();
        }, false);
        return canvas;
      })(),
      setStatus: function(text) {
        if (!text) {
          setTimeout(() => {
            overlay.classList.add('hidden');
          }, 400);
          return;
        }
        statusBox.innerText = text;
        const m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
        if (m) {
          const pct = Math.round((parseInt(m[2]) / parseInt(m[4])) * 100);
          progressBar.style.display = 'block';
          progressFill.style.width = pct + '%';
        }
      },
      totalDependencies: 0,
      monitorRunDependencies: function(left) {
        this.totalDependencies = Math.max(this.totalDependencies, left);
        if (left === 0) {
          statusBox.innerText = 'Εκκίνηση παιχνιδιού...';
          setTimeout(() => {
            overlay.classList.add('hidden');
          }, 600);
        } else {
          progressBar.style.display = 'block';
          const pct = Math.round(((this.totalDependencies - left) / this.totalDependencies) * 100);
          progressFill.style.width = pct + '%';
          statusBox.innerText = `Φόρτωση αρχείων... (${pct}%)`;
        }
      }
    };

    startBtn.addEventListener('click', function() {
      startBtn.style.display = 'none';
      progressBar.style.display = 'block';
      statusBox.innerText = 'Φόρτωση μηχανής ScummVM WebAssembly...';

      const script = document.createElement('script');
      script.src = 'scummvm.js?v=' + BUILD;
      document.body.appendChild(script);
    });
  </script>
</body>
</html>
