<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="manifest" href="manifest.json">
  <title>Forestia: Η Μεγάλη Περιπέτεια (1998) - Web Edition</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at center, #1a2a18 0%, #080f08 100%);
      color: #e0eed0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      padding: 16px;
    }
    header {
      margin-bottom: 12px;
      text-align: center;
    }
    h1 {
      font-size: 1.6rem;
      letter-spacing: 0.05em;
      color: #c9e69c;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
      margin-bottom: 4px;
    }
    .subtitle {
      font-size: 0.85rem;
      color: #8fa880;
    }
    #game-container {
      position: relative;
      width: min(94vw, calc(74vh * 4 / 3));
      aspect-ratio: 4 / 3;
      background: #000;
      box-shadow: 0 12px 50px rgba(0,0,0,0.85), 0 0 0 2px #3d5530;
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas#canvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    #overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(16, 28, 14, 0.75) 0%, rgba(6, 12, 6, 0.95) 100%), url('splash.png') center/cover no-repeat;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 10;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }
    #overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .splash-card {
      background: rgba(14, 26, 12, 0.88);
      border: 2px solid #5a7d3c;
      border-radius: 16px;
      padding: 20px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      box-shadow: 0 15px 45px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.15);
      backdrop-filter: blur(6px);
      max-width: 440px;
      width: 90%;
      text-align: center;
    }
    .splash-img {
      width: 100%;
      max-width: 320px;
      height: auto;
      border-radius: 8px;
      border: 2px solid #3d5530;
      box-shadow: 0 4px 18px rgba(0,0,0,0.6);
      image-rendering: pixelated;
    }
    .splash-title {
      font-size: 1.25rem;
      font-weight: bold;
      color: #daf0b2;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }
    .splash-edition {
      font-size: 0.8rem;
      color: #9ecc75;
      margin-top: -8px;
    }
    .btn-play {
      background: linear-gradient(180deg, #5da832 0%, #356e18 100%);
      color: #fff;
      border: 1px solid #8be046;
      padding: 13px 36px;
      font-size: 1.15rem;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.4);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .btn-play:hover {
      transform: scale(1.04);
      background: linear-gradient(180deg, #6cbf3a 0%, #3f831d 100%);
      box-shadow: 0 6px 22px rgba(80, 160, 40, 0.4);
    }
    .btn-play:active {
      transform: scale(0.98);
    }
    #status-box {
      font-size: 0.85rem;
      color: #b5d59f;
      text-align: center;
    }
    #progress-bar {
      width: 260px;
      height: 8px;
      background: #152412;
      border-radius: 4px;
      overflow: hidden;
      display: none;
      border: 1px solid #3d5530;
    }
    #progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #62b336, #9ef060);
      transition: width 0.2s ease;
    }
    footer {
      margin-top: 14px;
      display: flex;
      gap: 18px;
      font-size: 0.8rem;
      color: #6d8860;
    }
    footer a {
      color: #9ecc75;
      text-decoration: none;
    }
    footer a:hover {
      text-decoration: underline;
    }

    /* On-screen controls (keyboard / fullscreen), shown on touch devices */
    #controls {
      position: absolute;
      top: max(6px, env(safe-area-inset-top));
      right: max(6px, env(safe-area-inset-right));
      z-index: 20;
      display: none;
      gap: 8px;
    }
    #controls.visible { display: flex; }
    .ctrl-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(139, 224, 70, 0.6);
      background: rgba(14, 26, 12, 0.6);
      color: #daf0b2;
      font-size: 22px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0.55;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .ctrl-btn:active, .ctrl-btn.active { opacity: 1; background: rgba(53, 110, 24, 0.85); }
    /* Hidden text field used to summon the phone's on-screen keyboard.
       Must stay "visible" and >=16px font, or iOS refuses focus / zooms in. */
    #kbd-input {
      position: fixed;
      top: 0;
      left: 0;
      width: 1px;
      height: 1px;
      opacity: 0;
      border: 0;
      padding: 0;
      font-size: 16px;
      background: transparent;
      color: transparent;
      caret-color: transparent;
      pointer-events: none;
      z-index: -1;
    }

    /* Mobile / small screens: game only, fills the whole screen.
       ScummVM letterboxes the 4:3 picture inside the canvas itself. */
    @media (pointer: coarse), (max-width: 820px), (max-height: 560px) {
      html, body {
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
      }
      body {
        padding: 0;
        background: #000;
        display: block;
      }
      header, footer { display: none; }
      #game-container {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        aspect-ratio: auto;
        border-radius: 0;
        box-shadow: none;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        touch-action: none;
      }
      #overlay { overflow-y: auto; }
    }
    @media (max-height: 560px) {
      .splash-card { padding: 10px 18px; gap: 8px; }
      .splash-img { max-height: 34vh; width: auto; }
      .splash-title { font-size: 1.05rem; }
      .btn-play { padding: 10px 28px; font-size: 1.05rem; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Forestia: Η Μεγάλη Περιπέτεια</h1>
    <div class="subtitle">Digital Preservation &bull; Ελληνική Έκδοση 1998 &bull; Powered by ScummVM WebAssembly</div>
  </header>

  <div id="game-container">
    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>

    <div id="controls">
      <button id="kbd-btn" class="ctrl-btn" type="button" aria-label="Keyboard" title="Πληκτρολόγιο">&#9000;</button>
      <button id="fs-btn" class="ctrl-btn" type="button" aria-label="Fullscreen" title="Πλήρης Οθόνη">&#x26F6;</button>
    </div>
    <input id="kbd-input" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" aria-hidden="true" tabindex="-1">

    <div id="overlay">
      <div class="splash-card">
        <img class="splash-img" src="splash.png" alt="Forestia - Cover Artwork">
        <div class="splash-title">Forestia: Η Μεγάλη Περιπέτεια</div>
        <div class="splash-edition">Εκδοτικός Οργανισμός Λιβάνη / Kaiphea (1998)</div>

        <button id="start-btn" class="btn-play">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          Έναρξη Παιχνιδιού (Play)
        </button>

        <div id="progress-bar"><div id="progress-fill"></div></div>
        <div id="status-box">Κάντε κλικ για άμεση εκκίνηση &amp; αναπαραγωγή ήχου</div>
      </div>
    </div>
  </div>

  <footer>
    <a href="https://github.com/panlybero/forestia-greek-adventure" target="_blank" rel="noopener">GitHub Project</a>
    &bull;
    <a href="https://github.com/panlybero/forestia-greek-adventure/releases" target="_blank" rel="noopener">Desktop Versions</a>
    &bull;
    <a href="#" id="fullscreen-btn">Πλήρης Οθόνη</a>
    &bull;
    <span style="opacity:.6">build 20261014c</span>
  </footer>

  <script>
    const BUILD = '20261014c'; // bump to bust browser caches of the engine/config
    window.resolveScummUrl = function(url) {
      var clean = url.startsWith('/') ? url.substring(1) : url;
      var base = window.location.href;
      if (!base.endsWith('/')) {
        if (base.endsWith('.html') || base.endsWith('.htm')) {
          base = base.substring(0, base.lastIndexOf('/') + 1);
        } else {
          base = base + '/';
        }
      }
      var out = new URL(clean, base);
      if (clean === 'scummvm.ini') out.searchParams.set('v', BUILD);
      return out.href;
    };

    const overlay = document.getElementById('overlay');
    const startBtn = document.getElementById('start-btn');
    const statusBox = document.getElementById('status-box');
    const progressBar = document.getElementById('progress-bar');
    const progressFill = document.getElementById('progress-fill');
    const canvas = document.getElementById('canvas');
    const fullscreenBtn = document.getElementById('fullscreen-btn');

    const container = document.getElementById('game-container');
    const controls = document.getElementById('controls');
    const kbdBtn = document.getElementById('kbd-btn');
    const fsBtn = document.getElementById('fs-btn');
    const kbdInput = document.getElementById('kbd-input');

    // ---------- Fullscreen ----------
    const fsSupported = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
    function isFullscreen() {
      return !!(document.fullscreenElement || document.webkitFullscreenElement);
    }
    function toggleFullscreen() {
      if (!isFullscreen()) {
        const req = container.requestFullscreen || container.webkitRequestFullscreen;
        if (req) {
          const r = req.call(container, { navigationUI: 'hide' });
          if (r && r.catch) r.catch(() => {});
          // Prefer landscape once fullscreen (Android only; iOS ignores this)
          if (screen.orientation && screen.orientation.lock) {
            setTimeout(() => screen.orientation.lock('landscape').catch(() => {}), 300);
          }
        }
      } else {
        const exit = document.exitFullscreen || document.webkitExitFullscreen;
        if (exit) {
          const r = exit.call(document);
          if (r && r.catch) r.catch(() => {});
        }
      }
    }
    fullscreenBtn.addEventListener('click', (e) => { e.preventDefault(); toggleFullscreen(); });
    if (!fsSupported) fsBtn.style.display = 'none';
    fsBtn.addEventListener('click', (e) => { e.preventDefault(); toggleFullscreen(); });

    // ---------- Keep the engine's drawing buffer in sync with the canvas size ----------
    // SDL only re-measures the canvas on a window 'resize' event. If the engine
    // changes resolution (or the layout changes without a window resize), the
    // drawing buffer no longer matches the on-screen size and the picture is
    // stretched. Detect a mismatch and poke SDL with a synthetic resize.
    let syncTimer = null;
    function scheduleCanvasSync() {
      clearTimeout(syncTimer);
      syncTimer = setTimeout(() => {
        const r = canvas.getBoundingClientRect();
        const d = window.devicePixelRatio || 1;
        if (r.width < 2 || r.height < 2) return;
        if (Math.abs(canvas.width - r.width * d) > 2 || Math.abs(canvas.height - r.height * d) > 2) {
          window.dispatchEvent(new Event('resize'));
        }
      }, 150);
    }
    if (window.ResizeObserver) new ResizeObserver(scheduleCanvasSync).observe(canvas);
    new MutationObserver(scheduleCanvasSync).observe(canvas, { attributes: true, attributeFilter: ['width', 'height'] });
    window.addEventListener('orientationchange', () => setTimeout(scheduleCanvasSync, 300));

    // iOS doesn't shrink the layout when the on-screen keyboard opens; follow the
    // visual viewport so the game stays visible above the keyboard.
    if (window.visualViewport) {
      const vv = window.visualViewport;
      const applyVV = () => {
        if (getComputedStyle(container).position === 'fixed') {
          container.style.height = vv.height + 'px';
          container.style.top = vv.offsetTop + 'px';
        } else {
          container.style.height = '';
          container.style.top = '';
        }
        scheduleCanvasSync();
      };
      vv.addEventListener('resize', applyVV);
      vv.addEventListener('scroll', applyVV);
      window.addEventListener('resize', applyVV);
    }

    // ---------- On-screen keyboard ----------
    // Phones only show their keyboard for a focused text field, so a hidden
    // <input> collects the typing and every character is forwarded to the game
    // as synthetic key events (Latin letters, digits, basic punctuation,
    // Backspace and Enter).
    const isTouch = window.matchMedia('(pointer: coarse)').matches || ('ontouchstart' in window);
    const NAMED_KEYS = {
      Backspace: ['Backspace', 8], Enter: ['Enter', 13], Escape: ['Escape', 27], Tab: ['Tab', 9],
      ArrowLeft: ['ArrowLeft', 37], ArrowUp: ['ArrowUp', 38], ArrowRight: ['ArrowRight', 39],
      ArrowDown: ['ArrowDown', 40], Delete: ['Delete', 46]
    };
    // Only unshifted punctuation: shifted symbols don't reach the game reliably.
    const PUNCT = {
      ' ': ['Space', 32], '-': ['Minus', 189], '.': ['Period', 190], ',': ['Comma', 188],
      "'": ['Quote', 222], '=': ['Equal', 187], ';': ['Semicolon', 186], '/': ['Slash', 191]
    };
    function keyInfo(key) {
      if (NAMED_KEYS[key]) return { code: NAMED_KEYS[key][0], keyCode: NAMED_KEYS[key][1], shift: false, text: key === 'Enter' ? '\r' : '' };
      if (/^[a-zA-Z]$/.test(key)) return { code: 'Key' + key.toUpperCase(), keyCode: key.toUpperCase().charCodeAt(0), shift: key !== key.toLowerCase(), text: key };
      if (/^[0-9]$/.test(key)) return { code: 'Digit' + key, keyCode: key.charCodeAt(0), shift: false, text: key };
      if (PUNCT[key]) return { code: PUNCT[key][0], keyCode: PUNCT[key][1], shift: false, text: key };
      return null; // non-Latin characters are not supported by the game's text fields
    }
    function fireKey(type, key, info) {
      const ev = new KeyboardEvent(type, { key, code: info.code, shiftKey: info.shift, bubbles: true, cancelable: true });
      const kc = (type === 'keypress' && info.text) ? info.text.charCodeAt(0) : info.keyCode;
      Object.defineProperty(ev, 'keyCode', { get: () => kc });
      Object.defineProperty(ev, 'which', { get: () => kc });
      Object.defineProperty(ev, 'charCode', { get: () => (type === 'keypress' && info.text) ? info.text.charCodeAt(0) : 0 });
      canvas.dispatchEvent(ev);
    }
    function sendKey(key) {
      const info = keyInfo(key);
      if (!info) return;
      // The engine tracks Shift from its own key events, so press it explicitly.
      const shiftInfo = { code: 'ShiftLeft', keyCode: 16, shift: true, text: '' };
      if (info.shift) fireKey('keydown', 'Shift', shiftInfo);
      fireKey('keydown', key, info);
      if (info.text) fireKey('keypress', key, info);
      fireKey('keyup', key, info);
      if (info.shift) fireKey('keyup', 'Shift', Object.assign({}, shiftInfo, { shift: false }));
    }

    // The field always holds a few sentinel spaces so Backspace on an
    // "empty" field still produces an input event we can see.
    const SENTINEL = '    ';
    let lastValue = SENTINEL;
    function resetKbdInput() {
      kbdInput.value = SENTINEL;
      lastValue = SENTINEL;
      try { kbdInput.setSelectionRange(SENTINEL.length, SENTINEL.length); } catch (e) {}
    }
    const isImeKey = (e) => e.isComposing || e.keyCode === 229 || e.key === 'Unidentified' || e.key === 'Process';
    // Keep the field's own key events away from the engine; we forward them ourselves.
    kbdInput.addEventListener('keydown', (e) => {
      e.stopPropagation();
      if (isImeKey(e)) return; // soft keyboards: handled via the 'input' event below
      if (e.key === 'Enter' || NAMED_KEYS[e.key] || (e.key.length === 1 && !e.ctrlKey && !e.metaKey)) {
        e.preventDefault();
        sendKey(e.key);
        if (e.key === 'Enter') resetKbdInput();
      }
    });
    ['keyup', 'keypress'].forEach((t) => kbdInput.addEventListener(t, (e) => {
      e.stopPropagation();
      if (!isImeKey(e)) e.preventDefault();
    }));
    kbdInput.addEventListener('input', (e) => {
      const v = kbdInput.value;
      let i = 0;
      while (i < lastValue.length && i < v.length && lastValue[i] === v[i]) i++;
      for (let k = lastValue.length; k > i; k--) sendKey('Backspace');
      for (const ch of v.slice(i)) sendKey(ch === '\n' ? 'Enter' : ch);
      lastValue = v;
      if (!e.isComposing && (v.length < SENTINEL.length || v.length > 200)) resetKbdInput();
    });
    kbdInput.addEventListener('focus', () => { resetKbdInput(); kbdBtn.classList.add('active'); });
    kbdInput.addEventListener('blur', () => kbdBtn.classList.remove('active'));
    // Don't let tapping the button steal focus from the field before we toggle it.
    kbdBtn.addEventListener('pointerdown', (e) => e.preventDefault());
    kbdBtn.addEventListener('mousedown', (e) => e.preventDefault());
    kbdBtn.addEventListener('click', (e) => {
      e.preventDefault();
      if (document.activeElement === kbdInput) {
        kbdInput.blur();
      } else {
        resetKbdInput();
        kbdInput.focus({ preventScroll: true });
      }
    });
    if (!isTouch) kbdBtn.style.display = 'none';

    function showControls() {
      if (isTouch) controls.classList.add('visible');
    }

    var Module = {
      arguments: ['forestia-win-el'],
      locateFile: function(path) {
        return path + '?v=' + BUILD;
      },
      preRun: [],
      postRun: [],
      print: function(text) {
        console.log('[ScummVM]', text);
      },
      printErr: function(text) {
        console.error('[ScummVM]', text);
      },
      canvas: (function() {
        canvas.addEventListener("webglcontextlost", function(e) {
          alert("WebGL context lost. Please reload the page.");
          e.preventDefault();
        }, false);
        return canvas;
      })(),
      setStatus: function(text) {
        if (!text) {
          setTimeout(() => {
            overlay.classList.add('hidden');
            showControls();
          }, 400);
          return;
        }
        statusBox.innerText = text;
        const m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
        if (m) {
          const pct = Math.round((parseInt(m[2]) / parseInt(m[4])) * 100);
          progressBar.style.display = 'block';
          progressFill.style.width = pct + '%';
        }
      },
      totalDependencies: 0,
      monitorRunDependencies: function(left) {
        this.totalDependencies = Math.max(this.totalDependencies, left);
        if (left === 0) {
          statusBox.innerText = 'Εκκίνηση παιχνιδιού...';
          setTimeout(() => {
            overlay.classList.add('hidden');
            showControls();
          }, 600);
          [1000, 3000, 6000].forEach((t) => setTimeout(scheduleCanvasSync, t));
        } else {
          progressBar.style.display = 'block';
          const pct = Math.round(((this.totalDependencies - left) / this.totalDependencies) * 100);
          progressFill.style.width = pct + '%';
          statusBox.innerText = `Φόρτωση αρχείων... (${pct}%)`;
        }
      }
    };

    // Browsers (Safari/iOS in particular) only allow an AudioContext to start
    // from inside a user gesture. The engine is loaded asynchronously, so SDL
    // would otherwise create its AudioContext long after the click and it would
    // stay suspended (= no sound). Create + unlock it here, synchronously in the
    // click handler, and hand it to SDL3, which reuses Module.SDL3.audioContext.
    function unlockAudio() {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try {
        const ctx = new AC();
        const buf = ctx.createBuffer(1, 1, ctx.sampleRate);
        const src = ctx.createBufferSource();
        src.buffer = buf;
        src.connect(ctx.destination);
        src.start(0);
        if (ctx.resume) ctx.resume().catch(() => {});
        Module.SDL3 = Module.SDL3 || {};
        Module.SDL3.audioContext = ctx;
      } catch (e) {
        console.warn('Audio unlock failed', e);
      }
      // Keep resuming on any later interaction (tab switches, iOS interruptions,
      // or if SDL ever recreates the context outside a gesture).
      const resume = () => {
        const c = Module.SDL3 && Module.SDL3.audioContext;
        if (c && c.state !== 'running' && c.resume) c.resume().catch(() => {});
      };
      ['pointerdown', 'mousedown', 'touchend', 'keydown'].forEach((ev) =>
        document.addEventListener(ev, resume, { capture: true, passive: true }));
    }

    startBtn.addEventListener('click', function() {
      unlockAudio();
      startBtn.style.display = 'none';
      progressBar.style.display = 'block';
      statusBox.innerText = 'Φόρτωση μηχανής ScummVM WebAssembly...';

      const script = document.createElement('script');
      script.src = 'scummvm.js?v=' + BUILD;
      document.body.appendChild(script);
    });
  </script>
</body>
</html>
