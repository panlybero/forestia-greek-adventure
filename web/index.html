<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Forestia: Η Μεγάλη Περιπέτεια (1998) - Web Edition</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle, #1a261a 0%, #080f08 100%);
      color: #e0eed0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }
    header {
      margin-bottom: 12px;
      text-align: center;
    }
    h1 {
      font-size: 1.5rem;
      letter-spacing: 0.05em;
      color: #c9e69c;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
      margin-bottom: 4px;
    }
    .subtitle {
      font-size: 0.85rem;
      color: #8fa880;
    }
    #game-container {
      position: relative;
      width: min(92vw, calc(72vh * 4 / 3));
      aspect-ratio: 4 / 3;
      background: #000;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8), 0 0 0 2px #3d5530;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas#canvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(10, 20, 10, 0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 10;
      transition: opacity 0.3s ease;
    }
    #overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .btn-play {
      background: linear-gradient(180deg, #4c8a2b 0%, #2f6114 100%);
      color: #fff;
      border: 1px solid #7ecc43;
      padding: 14px 32px;
      font-size: 1.15rem;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.3);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .btn-play:hover {
      transform: scale(1.04);
      background: linear-gradient(180deg, #5ba334 0%, #3a751a 100%);
    }
    #status-box {
      font-size: 0.9rem;
      color: #b5d59f;
      text-align: center;
      max-width: 80%;
    }
    #progress-bar {
      width: 240px;
      height: 8px;
      background: #1e3318;
      border-radius: 4px;
      overflow: hidden;
      display: none;
      border: 1px solid #3d5530;
    }
    #progress-fill {
      width: 0%;
      height: 100%;
      background: #7ecc43;
      transition: width 0.2s ease;
    }
    footer {
      margin-top: 14px;
      display: flex;
      gap: 20px;
      font-size: 0.8rem;
      color: #6d8860;
    }
    footer a {
      color: #9ecc75;
      text-decoration: none;
    }
    footer a:hover {
      text-decoration: underline;
    }
    .controls-hint {
      margin-top: 4px;
      font-size: 0.75rem;
      color: #647a59;
    }
  </style>
</head>
<body>
  <header>
    <h1>Forestia: Η Μεγάλη Περιπέτεια</h1>
    <div class="subtitle">Digital Preservation &bull; Ελληνική Έκδοση 1998 &bull; Powered by ScummVM WebAssembly</div>
  </header>

  <div id="game-container">
    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>

    <div id="overlay">
      <button id="start-btn" class="btn-play">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        Έναρξη Παιχνιδιού (Play)
      </button>
      <div id="progress-bar"><div id="progress-fill"></div></div>
      <div id="status-box">Κάντε κλικ για φόρτωση και αναπαραγωγή ήχου</div>
      <div class="controls-hint">Υποστηρίζει ποντίκι, πλήρη οθόνη και ελληνικά κείμενα</div>
    </div>
  </div>

  <footer>
    <a href="https://github.com/panlybero/forestia-greek-adventure" target="_blank" rel="noopener">GitHub Project</a>
    &bull;
    <a href="https://github.com/panlybero/forestia-greek-adventure/releases" target="_blank" rel="noopener">Desktop Versions</a>
    &bull;
    <a href="#" id="fullscreen-btn">Πλήρης Οθόνη</a>
  </footer>

  <script>
    const overlay = document.getElementById('overlay');
    const startBtn = document.getElementById('start-btn');
    const statusBox = document.getElementById('status-box');
    const progressBar = document.getElementById('progress-bar');
    const progressFill = document.getElementById('progress-fill');
    const canvas = document.getElementById('canvas');
    const fullscreenBtn = document.getElementById('fullscreen-btn');

    fullscreenBtn.addEventListener('click', (e) => {
      e.preventDefault();
      if (!document.fullscreenElement) {
        document.getElementById('game-container').requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    });

    var Module = {
      arguments: ['forestia-win-el'],
      preRun: [],
      postRun: [],
      print: function(text) {
        console.log('[ScummVM]', text);
      },
      printErr: function(text) {
        console.error('[ScummVM]', text);
      },
      canvas: (function() {
        canvas.addEventListener("webglcontextlost", function(e) {
          alert("WebGL context lost. Please reload the page.");
          e.preventDefault();
        }, false);
        return canvas;
      })(),
      setStatus: function(text) {
        if (!text) {
          overlay.classList.add('hidden');
          return;
        }
        statusBox.innerText = text;
        const m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
        if (m) {
          const pct = Math.round((parseInt(m[2]) / parseInt(m[4])) * 100);
          progressBar.style.display = 'block';
          progressFill.style.width = pct + '%';
        }
      },
      totalDependencies: 0,
      monitorRunDependencies: function(left) {
        this.totalDependencies = Math.max(this.totalDependencies, left);
        if (left === 0) {
          statusBox.innerText = 'Έτοιμο!';
          setTimeout(() => {
            overlay.classList.add('hidden');
          }, 400);
        } else {
          progressBar.style.display = 'block';
          const pct = Math.round(((this.totalDependencies - left) / this.totalDependencies) * 100);
          progressFill.style.width = pct + '%';
          statusBox.innerText = `Φόρτωση αρχείων... (${pct}%)`;
        }
      }
    };

    startBtn.addEventListener('click', function() {
      startBtn.style.display = 'none';
      progressBar.style.display = 'block';
      statusBox.innerText = 'Φόρτωση ScummVM WebAssembly...';

      const script = document.createElement('script');
      script.src = 'scummvm.js';
      document.body.appendChild(script);
    });
  </script>
</body>
</html>
